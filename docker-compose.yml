services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    # All 6 views work immediately with just `docker compose up` --
    # including View B (the 20-year historical explorer), which used
    # to need a local 172MB heat.db bind-mounted into the container
    # (and hit a real virtiofs hang on macOS Docker Desktop doing so).
    # That table now lives in Turso (a hosted, SQLite-compatible
    # database -- see app/api/history/route.ts) and is reached over
    # the network via TURSO_DATABASE_URL / TURSO_AUTH_TOKEN, so no
    # local file or bind mount is needed at all anymore. Pass those
    # two through from your .env.local, e.g. via an env_file directive
    # or --env-file on `docker compose up`.
